name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build tools
        run: npm install

      - name: Build Netplus installer
        run: npm run desktop:make -- --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Netplus-IPTV-Player-Setup
          path: release/*.exe
          if-no-files-found: error
