name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: ["build-v1.8.14", "build-v1.8.15"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build tools
        run: npm install --no-audit --no-fund

      - name: Build STB PLAY installer
        run: npm run desktop:make

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: STB-PLAY-Windows-Installer
          path: release/Netplus-IPTV-Player-Setup-*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/build-v1.8.14' || github.ref == 'refs/heads/build-v1.8.15' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $version = [string]$package.version
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'package.json has no version.' }
          $tag = "v$version"
          $installer = Get-ChildItem 'release\Netplus-IPTV-Player-Setup-*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'The Windows installer was not created.' }

          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag exists; uploading installer without overwriting existing assets."
            gh release upload $tag $installer.FullName --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create $tag $installer.FullName --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "STB PLAY $tag" --generate-notes
          }
