<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetPlus IPTV Player</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Load HLS.js for the player -->
    <script src="hls.min.js"></script>
</head>
<body class="theme-dark">
    
    <!-- Top Navigation Bar -->
    <nav id="modebar" hidden>
        <div class="nav-left">
            <button class="mode-button active" data-mode="live">📺 Live TV</button>
            <button class="mode-button" data-mode="vod">🎬 Movies & Series</button>
        </div>
        <div class="nav-right">
            <button id="settingsButton">⚙️ Settings</button>
        </div>
    </nav>

    <!-- Initial Setup / Portal Config -->
    <div id="setup">
        <form id="setupForm" class="glass-panel">
            <h2>Welcome to NetPlus</h2>
            <p>Please enter your portal details to connect.</p>
            <div id="setupError" class="error-msg" hidden></div>
            
            <div class="input-group">
                <label for="serviceId">Service ID / Portal URL</label>
                <input type="text" id="serviceId" placeholder="http://portal.example.com" required>
            </div>
            
            <div class="input-group">
                <label for="mac">MAC Address</label>
                <input type="text" id="mac" placeholder="00:1A:79:XX:XX:XX" required>
            </div>
            
            <div class="input-group">
                <label for="parentalPin">Parental PIN</label>
                <input type="password" id="parentalPin" placeholder="4-digit PIN" required>
            </div>
            
            <button type="submit" id="connectButton">Save & Connect</button>
        </form>
    </div>

    <!-- Live TV Workspace -->
    <div id="workspace" hidden>
        
        <!-- Sidebar: Categories/Groups -->
        <aside class="sidebar">
            <div class="list-header">
                <span id="groupCount"></span>
                <!-- Button to toggle group visibility editing -->
                <button id="editGroupsButton" class="icon-btn" title="Edit Group Visibility">👁️ Edit</button>
            </div>
            <div id="categories" class="scrollable-list"></div>
        </aside>

        <!-- Main Column: Channels -->
        <section class="channel-list">
            <div class="list-header channel-header">
                <input type="text" id="search" placeholder="Search channels...">
                <div class="header-actions">
                    <span id="channelCount"></span>
                    <!-- Button to toggle channel visibility editing -->
                    <button id="editChannelsButton" class="icon-btn" title="Edit Channel Visibility">👁️ Edit</button>
                </div>
            </div>
            <div id="channels" class="scrollable-list"></div>
        </section>

        <!-- Right Column: Video Player -->
        <section class="player-container">
            <div id="status" class="status-badge"><span></span></div>
            <div class="video-wrapper">
                <div id="placeholder" class="video-overlay">Select a channel to start playing</div>
                <div id="videoLoading" class="video-overlay" hidden>
                    <span class="spinner"></span> Loading stream...
                </div>
                <div id="notice" class="video-overlay error-overlay" hidden></div>
                <video id="video" controls autoplay></video>
            </div>
            <div id="nowPlaying" class="now-playing-bar"></div>
        </section>
    </div>

    <!-- VOD Workspace (Netflix Style) -->
    <div id="vodWorkspace" hidden>
        <div class="vod-header">
            <input type="text" id="vodSearch" placeholder="Search for movies, series, or genres...">
        </div>
        <div id="vodRows" class="vod-content"></div>
    </div>

    <!-- VOD Info Modal -->
    <div id="vodModal" class="modal-overlay" hidden>
        <div class="modal-content vod-modal-box">
            <button id="vodClose" class="close-btn">✖</button>
            <div class="modal-split">
                <div id="vodModalPoster" class="modal-poster"></div>
                <div class="modal-details">
                    <h2 id="vodModalTitle"></h2>
                    <p id="vodModalMeta" class="meta-text"></p>
                    <p id="vodModalDescription" class="desc-text"></p>
                    <button id="vodPlayButton" class="play-btn">▶ Play Now</button>
                </div>
            </div>
        </div>
    </div>

    <!-- NEW: Advanced Settings Modal -->
    <div id="settingsModal" class="modal-overlay" hidden>
        <div class="modal-content settings-box">
            <button id="closeSettingsButton" class="close-btn">✖</button>
            <h2>App Settings</h2>
            
            <div class="settings-section">
                <h3>Appearance</h3>
                <label for="themeSelect">App Theme</label>
                <select id="themeSelect">
                    <option value="dark">Dark Theme (Default)</option>
                    <option value="light">Light Theme</option>
                </select>
            </div>

            <div class="settings-section">
                <h3>Parental Controls</h3>
                <label for="newParentalPin">Change Parental PIN</label>
                <div class="input-row">
                    <input type="password" id="newParentalPin" placeholder="New 4-digit PIN" maxlength="4">
                    <button id="updatePinButton">Update PIN</button>
                </div>
                <span id="pinNotice" class="settings-notice" hidden></span>
            </div>

            <div class="settings-section warning-section">
                <h3>Portal Configuration</h3>
                <p>Need to update your MAC address or Provider URL? Resetting your portal will log you out.</p>
                <button id="resetPortalButton" class="danger-btn">Reset Portal & Log Out</button>
            </div>
        </div>
    </div>

    <!-- Main Application Logic -->
    <script src="app.js"></script>
</body>
</html>
